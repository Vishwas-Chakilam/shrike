[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shrike-local-review"
version = "0.1.0"
description = "Offline Python security review and CI reporting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
shrike = "shrike.cli:main"

[tool.setuptools.packages.find]
include = ["shrike*"]
