name: Shrike source review
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m shrike.cli --target . --fail-on high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shrike-review
          path: .shrike/
          include-hidden-files: true
